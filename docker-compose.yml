version: '3.8'

services:
  bentopdf:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bentopdf
    ports:
      - "3000:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
